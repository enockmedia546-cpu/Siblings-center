<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Siblings Center | Music</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBdlDAj6SBzRChqDRfvecD_XRFgeSjKtiQ",
  authDomain: "siblings-140f7.firebaseapp.com",
  projectId: "siblings-140f7",
  storageBucket: "siblings-140f7.appspot.com",
  messagingSenderId: "17665689198",

</script>

<style>
/* General styling, keep as your existing design */
body, html{margin:0;padding:0;font-family:Arial;width:100%;height:100%;}
.full-bg{width:100%;min-height:100vh;background-size:cover;background-position:center;position:relative;color:#5B0E9E;padding-bottom:50px;}
.header{display:flex;align-items:center;justify-content:space-between;background:#5B0E9E;color:white;padding:15px 20px;border-bottom-left-radius:20px;border-bottom-right-radius:20px;}
.header i{color:white;cursor:pointer;font-size:22px;}
.header h3{margin:0;flex-grow:1;text-align:center;font-size:20px;}

.request-btn{background:#5B0E9E;color:white;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:bold;}
.request-btn i{margin-right:5px;}
#requestPop{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;justify-content:center;align-items:center;}
#requestPop .popup-content{background:white;padding:20px;border-radius:12px;width:90%;max-width:400px;position:relative;}
#requestPop .popup-content span{position:absolute;top:8px;right:12px;cursor:pointer;font-size:20px;}

.category-grid{padding:20px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:10px;}
.category-card{display:flex;align-items:center;gap:12px;cursor:pointer;color:#5B0E9E;font-weight:bold;text-shadow:0 2px 5px rgba(255,255,255,0.8);}
.music-icon{font-size:26px;color:#5B0E9E;}

#searchBar{width:95%;padding:10px 12px;margin:10px auto;border-radius:12px;border:none;font-size:16px;}

#musicList{background-size:cover;border-radius:20px;padding:15px;display:flex;flex-direction:column;gap:10px;margin:10px;}
.music-bar{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer;color:#5B0E9E;}
.music-bar div b,.music-bar div p{text-shadow:0 2px 5px rgba(255,255,255,0.8);}

#player{display:flex;flex-direction:column;width:90%;max-width:900px;margin:20px auto;padding:20px;text-align:center;border-radius:20px;position:relative;background-size:cover;background-position:center;}
#player::before{content:"";position:absolute;top:0;left:0;width:100%;height:100%;background: rgba(255,255,255,0.1);border-radius:20px;z-index:0;}
#player > *{position:relative;z-index:1;}
#visualizer{height:120px;display:flex;align-items:flex-end;gap:5px;margin-bottom:15px;}
.bar{flex:1;background:#5B0E9E;border-radius:4px;height:10%;}

.controls{display:flex;justify-content:center;gap:30px;font-size:26px;margin-top:20px;color:#5B0E9E;}
.extra-controls{display:flex;justify-content:center;gap:25px;font-size:18px;margin-top:15px;color:#5B0E9E;}
</style>
</head>
<body>

<!-- CATEGORY VIEW -->
<div id="catBg" class="full-bg" style="background-image:url('music1.webp')">
  <div class="header"><h3>Music</h3></div>
  <div class="category-grid" id="categoryGrid"></div>
  <div style="padding:15px;text-align:right;">
    <button class="request-btn" onclick="openRequest()"><i class="fa fa-plus"></i> Request a Song</button>
  </div>
</div>

<!-- MUSIC LIST VIEW -->
<div id="listBg" class="full-bg" style="background-image:url('music2.jpeg'); display:none;">
  <div class="header"><i class="fa fa-arrow-left" onclick="goBack()"></i><h3 id="catTitle"></h3></div>
  <input type="text" id="searchBar" placeholder="Search songs...">
  <div id="musicList"></div>
</div>

<!-- PLAYER VIEW -->
<div id="playerBg" class="full-bg" style="background-image:url('music.jpg'); display:none;">
  <div class="header"><i class="fa fa-arrow-left" onclick="goBack()"></i><h3 id="playerTitle"></h3></div>
  <div id="player">
    <div id="visualizer"></div>
    <h3 id="title"></h3>
    <p id="artist"></p>
    <div class="controls">
      <i class="fa fa-backward" onclick="prev()"></i>
      <i class="fa fa-play" id="playBtn" onclick="toggle()"></i>
      <i class="fa fa-forward" onclick="next()"></i>
    </div>
    <div class="extra-controls">
      <i class="fa fa-shuffle" id="shuffleBtn" onclick="toggleShuffle()"></i>
      <i class="fa fa-repeat" id="repeatBtn" onclick="toggleRepeat()"></i>
      <i class="fa fa-list" onclick="showPlaylist()"></i>
      <i class="fa fa-sliders" onclick="toggleEQ()"></i>
    </div>
  </div>
  <audio id="audio" autoplay></audio>
</div>

<!-- REQUEST POPUP -->
<div id="requestPop">
  <div class="popup-content">
    <span onclick="closeRequest()">&times;</span>
    <h3>Request a Song</h3>
    <input type="text" id="reqTitle" placeholder="Song Title">
    <input type="text" id="reqArtist" placeholder="Artist Name">
    <button onclick="submitRequest()">Submit</button>
  </div>
</div>

<script type="module">
import { collection, addDoc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

// SONG DATA
const songs=[
  {title:"We Won't Stop",artist:"Jw",src:"jw.mp3",cat:"Jw Songs", artwork:"cover1.jpg"},
  {title:"Track 1",artist:"Modecaii",src:"mod1.mp3",cat:"Modecaii Zm", artwork:"cover2.jpg"},
  {title:"Track 2",artist:"Modecaii",src:"mod2.mp3",cat:"Modecaii Zm", artwork:"cover3.jpg"},
  {title:"Track 3",artist:"Modecaii",src:"mod3.mp3",cat:"Modecaii Zm", artwork:"mode.jpg"},
  {title:"Track 4",artist:"Modecaii",src:"mod4.mp3",cat:"Modecaii Zm", artwork:"mode.jpg"},
  {title:"Track 5",artist:"Modecaii",src:"mod5.mp3",cat:"Modecaii Zm", artwork:"mode.jpg"},
  {title:"Track 6",artist:"Modecaii",src:"mod6.mp3",cat:"Modecaii Zm", artwork:"mode.jpg"},
  {title:"Track 7",artist:"Modecaii",src:"mod7.mp3",cat:"Modecaii Zm", artwork:"mode.jpg"},
  {title:"Track 8",artist:"Modecaii",src:"mod8.mp3",cat:"Modecaii Zm", artwork:"mode.jpg"},
  {title:"Track 9",artist:"Modecaii",src:"mod9.mp3",cat:"Modecaii Zm", artwork:"mode.jpg"},
  {title:"Track 10",artist:"Modecaii",src:"mod10.mp3",cat:"Modecaii Zm", artwork:"mode.jpg"},
  {title:"Pretty Girls",artist:"Modecaii",src:"mod11.mp3",cat:"Modecaii Zm", artwork:"mode.jpg"},
  {title:"Track 12",artist:"Modecaii",src:"mod12.mp3",cat:"Modecaii Zm", artwork:"mode.jpg"},
  {title:"Yo Maps ft Stonebwoy_-_I wanna Eat",artist:"Yo Maps Yo",src:"eat.mp3",cat:"Yo Maps Yo", artwork:"maps.jpg"},
  {title:"Yo Maps Ft Afunika_-_Judas",artist:"Yo Maps Yo",src:"judas.mp3",cat:"Yo Maps Yo", artwork:"maps.jpg"},
  {title:"Tribute To Dandy Crazy",artist:"Yo Maps Yo",src:"wish.mp3",cat:"Yo Maps Yo", artwork:"maps.jpg"},
  {title:"Mr And Mrs",artist:"Yo Maps Yo",src:"mr.mp3",cat:"Yo Maps Yo", artwork:"maps.jpg"},
  {title:"Ex Wamunandi",artist:"Yo Maps Yo",src:"ex.mp3",cat:"Yo Maps Yo", artwork:"maps.jpg"},
  {title:"Musunge",artist:"Yo Maps Yo",src:"musunge.mp3",cat:"Yo Maps Yo", artwork:"maps.jpg"},
  {title:"Nkalapembela_Yo Maps Yo ft Xaven",artist:"Yo Maps Yo",src:"pembela.mp3",cat:"Yo Maps Yo", artwork:"maps.jpg"},
  {title:"Ba Mayi",artist:"Yo Maps Yo",src:"bamayi.mp3",cat:"Yo Maps Yo", artwork:"maps.jpg"},{title:"Bekuchinga Ft Yo Maps",artist:"Coziem",src:"music.mp3",cat:"Yo Maps Yo", artwork:"maps.jpg"},
  {title:"Aweah",artist:"Yo Maps Yo",src:"awe.mp3",cat:"Yo Maps Yo", artwork:"maps.jpg"},
  {title:"Confirmation Ft Iyanya",artist:"Yo Maps Yo",src:"confirm.mp3",cat:"Yo Maps Yo", artwork:"maps.jpg"},
  {title:"Natural Ft Yo Maps Yo",artist:"Macky 2",src:"natural.mp3",cat:"Yo Maps Yo", artwork:"maps.jpg"},
  {title:"Imbwa Ndine",artist:"Prince Luv",src:"dog.mp3",cat:"Yo Maps Yo", artwork:"maps.jpg"},
  {title:"Nga Te Ba Yaweh",artist:"Yo Maps Yo",src:"yawe.mp3",cat:"Yo Maps Yo", artwork:"maps.jpg"},
  {title:"Try Again Ft Abel Chungu",artist:"Yo Maps Yo",src:"tagain.mp3",cat:"Yo Maps Yo", artwork:"maps.jpg"},
  {title:"No More",artist:"Yo Maps Yo",src:"nomo.mp3",cat:"Yo Maps Yo", artwork:"maps.jpg"},
  {title:"Tiliko",artist:"Yo Maps Yo Ft T-Sean",src:"tiliko.mp3",cat:"Yo Maps Yo", artwork:"maps.jpg"},
  {title:"Refresh",artist:"Yo Maps Yo",src:"refresh.mp3",cat:"Yo Maps Yo", artwork:"maps.jpg"},
  {title:"Teti",artist:"Dizmo Ft Yo Maps Yo",src:"teti.mp3",cat:"Yo Maps Yo", artwork:"maps.jpg"},
  {title:"Tribute To ECL",artist:"Yo Maps Yo",src:"regards.mp3",cat:"Yo Maps Yo", artwork:"maps.jpg"},
  {title:"Weakness",artist:"Bobby East Ft Yo Maps Yo",src:"weak.mp3",cat:"Yo Maps Yo", artwork:"maps.jpg"},
  {title:"Bana Pwanya",artist:"Kell Kay Ft Yo Maps Yo",src:"pwanya.mp3",cat:"Relax", artwork:"maps.jpg"},
  {title:"Mr Romantic",artist:"Yo Maps Yi",src:"romantic.mp3",cat:"Relax", artwork:"maps.jpg"},
  {title:"Remember Me",artist:"Chile One",src:"remember.mp3",cat:"Chile One", artwork:"chile.jpg"},
  {title:"Eagle One",artist:"Chile One",src:"eagle.mp3",cat:"Chile One", artwork:"chile.jpg"},
  {title:"Back Again",artist:"Chile One",src:"bagain.mp3",cat:"Chile One", artwork:"chile.jpg"},
  {title:"Basebele",artist:"Chile One",src:"sebele.mp3",cat:"Chile One ft Drifta Trek", artwork:"chile.jpg"},
  {title:"Make Me a Dad",artist:"Chile One",src:"mdad.mp3",cat:"Chile One", artwork:"chile.jpg"},
  {title:"Mukaimwena",artist:"Chile One",src:"mwena.mp3",cat:"Chile One", artwork:"chile.jpg"},
  {title:"Vacancy",artist:"Chile One ft Frank ro",src:"vacancy.mp3",cat:"Chile One", artwork:"chile.jpg"},
  {title:"Tekantemba",artist:"Chile One",src:"ntemba.mp3",cat:"Chile One", artwork:"chile.jpg"},
  {title:"Marry",artist:"Chile One Ft Chef 187",src:"marry.mp3",cat:"Chile One", artwork:"chile.jpg"},
  {title:"Tafyakapwepo",artist:"Chile One",src:"ta.mp3",cat:"Chile One", artwork:"chile.jpg"},
  {title:"Fire",artist:"Cleo Ice Queen ft Yo Maps Yo",src:"fire.mp3",cat:"Yo Maps Yo", artwork:"maps.jpg"},
 
  {title:"Tsunami",artist:"Goblex",src:"goblex.mp3",cat:"Latest", artwork:"cover.jpg"}
];
const categories=["Jw Songs","Zed Mix","Yo Maps Yo","Odies","Chile One","Modecaii Zm","African Mix","Latest"];
let currentSongs=[], index=0, currentCat=null, isShuffle=false, repeatMode="all";

const db = window.db;

// POPUP REQUEST
function openRequest(){ document.getElementById('requestPop').style.display='flex'; }
function closeRequest(){ document.getElementById('requestPop').style.display='none'; }
async function submitRequest(){
  const title=document.getElementById('reqTitle').value.trim();
  const artist=document.getElementById('reqArtist').value.trim();
  if(!title || !artist){ alert("Enter both title and artist"); return; }
  try{
    await addDoc(collection(db,"songRequests"), {title, artist, timestamp:new Date()});
    alert("Request submitted!");
    document.getElementById('reqTitle').value='';
    document.getElementById('reqArtist').value='';
    closeRequest();
  }catch(e){ console.error(e); alert("Failed to submit request."); }
}

// CATEGORY GRID
const catGrid=document.getElementById("categoryGrid");
categories.forEach(c=>{
  const d=document.createElement("div");
  d.className="category-card";
  d.innerHTML=`<i class="fa fa-folder music-icon"></i><b>${c}</b>`;
  d.onclick=()=>showMusicList(c);
  catGrid.appendChild(d);
});

// ELEMENTS
const listBg=document.getElementById("listBg");
const musicList=document.getElementById("musicList");
const playerBg=document.getElementById("playerBg");
const player=document.getElementById("player");
const audio=document.getElementById("audio");
const titleEl=document.getElementById("title");
const artistEl=document.getElementById("artist");
const playBtn=document.getElementById("playBtn");

// VIEW FUNCTIONS
function showCategories(){ document.getElementById('catBg').style.display='block'; listBg.style.display='none'; playerBg.style.display='none'; }
function showMusicList(cat){
  currentCat=cat;
  document.getElementById('catBg').style.display='none';
  listBg.style.display='block';
  playerBg.style.display='none';
  document.getElementById("catTitle").innerText=cat;
  currentSongs=songs.filter(s=>s.cat===cat);
  renderMusicList(currentSongs);
}
function showPlayer(i){
  index=i;
  listBg.style.display='none';
  playerBg.style.display='block';
  document.getElementById("playerTitle").innerText=currentSongs[index].title;
  load();
}
function goBack(){
  if(playerBg.style.display==='block') showMusicList(currentCat);
  else if(listBg.style.display==='block') showCategories();
}

// RENDER MUSIC LIST
function renderMusicList(listSongs){
  musicList.innerHTML='';
  listSongs.forEach((s,i)=>{
    const d=document.createElement("div");
    d.className="music-bar";
    d.innerHTML=`<i class="fa fa-music music-icon"></i><div><b>${s.title}</b><br>${s.artist}</div>`;
    d.onclick=()=>showPlayer(i);
    musicList.appendChild(d);
  });
}

// SEARCH
document.getElementById('searchBar').addEventListener('input', filterSongs);
function filterSongs(){
  const term=document.getElementById('searchBar').value.toLowerCase();
  renderMusicList(currentSongs.filter(s=>s.title.toLowerCase().includes(term) || s.artist.toLowerCase().includes(term)));
}

// AUDIO PLAYER
function load(){
  const song=currentSongs[index];
  audio.src=song.src;
  titleEl.innerText=song.title;
  artistEl.innerText=song.artist;
  audio.play();
  playBtn.className="fa fa-pause";
  updateMediaSession(song);
}
function toggle(){ if(audio.paused){audio.play();playBtn.className="fa fa-pause";} else{audio.pause();playBtn.className="fa fa-play";} }
function next(){ index=isShuffle?Math.floor(Math.random()*currentSongs.length):(index+1)%currentSongs.length; load(); }
function prev(){ index=(index-1+currentSongs.length)%currentSongs.length; load(); }
function toggleShuffle(){ isShuffle=!isShuffle; document.getElementById("shuffleBtn").style.color=isShuffle?"#00c853":"#5B0E9E"; }
function toggleRepeat(){ repeatMode=repeatMode==="all"?"one":repeatMode==="one"?"off":"all"; alert("Repeat: "+repeatMode); }
audio.onended=()=>{ repeatMode==="one"?load():repeatMode==="all"?next():null; }
function showPlaylist(){alert("Playlist coming soon")}
function toggleEQ(){alert("Equalizer coming soon")}

// VISUALIZER
const ctx=new (window.AudioContext||window.webkitAudioContext)();
const srcCtx=ctx.createMediaElementSource(audio);
const analyser=ctx.createAnalyser();
srcCtx.connect(analyser); analyser.connect(ctx.destination);
analyser.fftSize=64;
const data=new Uint8Array(analyser.frequencyBinCount);
const vis=document.getElementById("visualizer");
for(let i=0;i<20;i++){ let b=document.createElement("div"); b.className="bar"; vis.appendChild(b);}
function animate(){ requestAnimationFrame(animate); analyser.getByteFrequencyData(data); document.querySelectorAll(".bar").forEach((b,i)=>{ b.style.height=(data[i]/255*100)+"%"; }); }
animate();

// MEDIA SESSION API
function updateMediaSession(song){
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.title,
      artist: song.artist,
      album: "Siblings Center",
      artwork: [
        { src: song.artwork || "cover1.jpg", sizes: "96x96", type: "image/jpeg" },
        { src: song.artwork || "cover1.jpg", sizes: "512x512", type: "image/jpeg" }
      ]
    });
    navigator.mediaSession.setActionHandler('play', ()=>{ audio.play(); });
    navigator.mediaSession.setActionHandler('pause', ()=>{ audio.pause(); });
    navigator.mediaSession.setActionHandler('previoustrack', ()=>{ prev(); });
    navigator.mediaSession.setActionHandler('nexttrack', ()=>{ next(); });
  }
}

// EXPOSE FUNCTIONS
window.load = load; window.toggle = toggle; window.next = next; window.prev = prev;
window.toggleShuffle = toggleShuffle; window.toggleRepeat = toggleRepeat;
window.showPlaylist = showPlaylist; window.toggleEQ = toggleEQ;
window.filterSongs = filterSongs; window.showMusicList = showMusicList;
window.showPlayer = showPlayer; window.goBack = goBack;
window.openRequest = openRequest; window.closeRequest = closeRequest; window.submitRequest = submitRequest;

// INIT VIEW
showCategories();
</script>
</body>
</html>
