<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Siblings Center | Movies</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#F5F3FA;
}

/* HEADER */
.header{
    background:#5B0E9E;
    color:white;
    padding:22px;
    border-bottom-left-radius:25px;
    border-bottom-right-radius:25px;
    display:flex;
    align-items:center;
    gap:15px;
}
.header i{
    font-size:22px;
    cursor:pointer;
}
.header h2{margin:0}

/* CATEGORY BUTTONS */
.category-select{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
    padding:15px;
}
.category-select button{
    background:#5B0E9E;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:20px;
    cursor:pointer;
}
.category-select button:hover{
    background:#3B0A66;
}

/* MOVIE GRID */
.movie-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    padding:20px;
}
.movie-card{
    position:relative;
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
}
.movie-card img{
    width:100%;
    height:200px;
    object-fit:cover;
}
.play-icon{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:40px;
    color:white;
    pointer-events:none;
}

/* MODAL */
#overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    display:none;
    z-index:9;
}
#movieModal{
    position:fixed;
    top:8%;
    left:50%;
    transform:translateX(-50%);
    width:95%;
    height:55vh;
    background:black;
    display:none;
    z-index:10;
    border-radius:12px;
}
#movieModal iframe{
    width:100%;
    height:100%;
    border:none;
}
.close-btn{
    position:absolute;
    top:8px;
    right:8px;
    width:32px;
    height:32px;
    border-radius:50%;
    border:none;
    background:rgba(0,0,0,.7);
    color:white;
    font-size:20px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
    <i class="fa fa-arrow-left" onclick="window.history.back()"></i>
    <h2>Movies</h2>
</div>

<div class="category-select">
    <button data-cat="action">Action</button>
    <button data-cat="funny">Funny</button>
    <button data-cat="nigerian">Nigerian</button>
</div>

<div id="moviesArea"></div>

<div id="overlay"></div>
<div id="movieModal">
    <iframe id="modalVideo"></iframe>
    <button class="close-btn" onclick="closeMovie()">×</button>
</div>

<script>
const movies = {
    action:[
        {img:"action1.jpg", video:"https://drive.google.com/file/d/ACTION1/preview"},
        {img:"action2.jpg", video:"https://drive.google.com/file/d/ACTION2/preview"}
    ],
    funny:[
        {img:"funny1.jpg", video:"https://drive.google.com/file/d/FUNNY1/preview"},
        {img:"funny2.jpg", video:"https://drive.google.com/file/d/FUNNY2/preview"}
    ],
    nigerian:[
        {img:"nigerian1.jpg", video:"https://drive.google.com/file/d/NIGERIAN1/preview"},
        {img:"nigerian2.jpg", video:"https://drive.google.com/file/d/NIGERIAN2/preview"}
    ]
};

const buttons = document.querySelectorAll(".category-select button");
const moviesArea = document.getElementById("moviesArea");
const overlay = document.getElementById("overlay");
const modal = document.getElementById("movieModal");
const iframe = document.getElementById("modalVideo");

buttons.forEach(btn=>{
    btn.addEventListener("click",()=>{
        const cat = btn.dataset.cat;
        loadMovies(cat);
    });
});

function loadMovies(category){
    moviesArea.innerHTML="";
    const grid = document.createElement("div");
    grid.className="movie-grid";

    movies[category].forEach(movie=>{
        const card = document.createElement("div");
        card.className="movie-card";
        card.innerHTML=`
            <img src="${movie.img}">
            <i class="fa fa-play-circle play-icon"></i>
        `;
        card.onclick=()=>{
            iframe.src=movie.video;
            modal.style.display="block";
            overlay.style.display="block";
        }
        grid.appendChild(card);
    });

    moviesArea.appendChild(grid);
}

overlay.onclick=closeMovie;

function closeMovie(){
    modal.style.display="none";
    overlay.style.display="none";
    iframe.src="";
}
</script>

</body>
</html>
