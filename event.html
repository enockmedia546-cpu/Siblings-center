<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Family Event | Siblings Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Arial;background:#f4f4f8}

/* Header */
header{
 background:linear-gradient(135deg,#6a0dad,#8e2de2);
 color:white;
 padding:16px;
 display:flex;
 align-items:center;
}
header h2{margin:0 auto;}
.back-btn{font-size:22px;cursor:pointer}

/* Events */
.event{
 background:white;
 margin:10px;
 padding:15px;
 border-radius:12px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 box-shadow:0 2px 6px rgba(0,0,0,.1);
}
.today{border-left:6px solid #8e2de2;background:#f3e8ff}

/* Three-dot menu */
.menu{
 position:relative;
}
.dots{font-size:20px;cursor:pointer;padding:5px}
.menu-content{
 display:none;
 position:absolute;
 right:0;
 background:white;
 border-radius:8px;
 box-shadow:0 2px 10px rgba(0,0,0,.2);
 z-index:10;
}
.menu-content div{
 padding:10px 15px;
 cursor:pointer;
}
.menu-content div:hover{background:#eee}

/* Floating + */
.add-btn{
 position:fixed;
 bottom:20px;
 right:20px;
 width:60px;
 height:60px;
 border-radius:50%;
 background:#6a0dad;
 color:white;
 font-size:36px;
 border:none;
 box-shadow:0 4px 12px rgba(0,0,0,.3);
 cursor:pointer;
}

/* Popup */
.popup{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.5);
 display:none;
 align-items:center;
 justify-content:center;
 z-index:20;
}
.popup-box{
 background:white;
 width:90%;
 max-width:400px;
 padding:20px;
 border-radius:15px;
 display:flex;
 flex-direction:column;
}
.popup-box input{
 width:100%;
 padding:12px;
 margin:10px 0;
 border-radius:8px;
 border:1px solid #ccc;
}
.popup-box button{
 width:100%;
 background:#6a0dad;
 color:white;
 padding:12px;
 border:none;
 border-radius:10px;
 cursor:pointer;
}

/* Toast notifications */
.toast{
 position:fixed;
 top:20px;
 right:20px;
 background:#6a0dad;
 color:white;
 padding:12px 20px;
 border-radius:8px;
 box-shadow:0 2px 6px rgba(0,0,0,.2);
 opacity:0;
 transform:translateY(-20px);
 transition:opacity 0.5s ease, transform 0.5s ease;
 z-index:100;
}
.toast.show{
 opacity:1;
 transform:translateY(0);
}
</style>
</head>

<body>

<header>
<span class="back-btn" onclick="goBack()">←</span>
<h2>Family Events</h2>
</header>

<div id="eventList"></div>

<button class="add-btn" onclick="openPopup()">+</button>

<div class="popup" id="popup">
  <div class="popup-box">
    <h3 id="popupTitle">Add Event</h3>
    <input id="title" placeholder="Event name">
    <input id="date" type="date">
    <button id="saveBtn">Save</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, doc, deleteDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyBdlDAj6SBzRChqDRfvecD_XRFgeSjKtiQ",
 authDomain: "siblings-140f7.firebaseapp.com",
 projectId: "siblings-140f7",
 storageBucket: "siblings-140f7.firebasestorage.app",
 messagingSenderId: "17665689198",
 appId: "1:17665689198:web:575e848f837d7b35b4c87f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let editId = null;
const popup = document.getElementById("popup");
const saveBtn = document.getElementById("saveBtn");

let prevEvents = {};

/* Live list + notifications */
onSnapshot(collection(db,"events"), snap=>{
 const eventList = document.getElementById("eventList");
 const today = new Date().toISOString().split("T")[0];
 const currentEvents = {};
 eventList.innerHTML="";

 snap.forEach(docu=>{
   const e = docu.data();
   const id = docu.id;
   currentEvents[id] = e;

   const div = document.createElement("div");
   div.className="event";
   if(e.date===today) div.classList.add("today");

   div.innerHTML = `
    <div>
      <strong>${e.title}</strong><br>
      <small>${e.date} • Added by ${e.createdBy || "Unknown"}</small>
    </div>
    <div class="menu">
      <span class="dots" onclick="toggleMenu('${id}')">⋮</span>
      <div class="menu-content" id="menu-${id}">
        <div onclick="editEvent('${id}','${e.title}','${e.date}')">Edit</div>
        <div onclick="deleteEvent('${id}')">Delete</div>
      </div>
    </div>
   `;

   eventList.appendChild(div);
 });

 /* Compare snapshots for notifications */
 Object.keys(currentEvents).forEach(id=>{
   if(!prevEvents[id]){
     showToast(`Event added: ${currentEvents[id].title}`);
   } else if(JSON.stringify(prevEvents[id]) !== JSON.stringify(currentEvents[id])){
     showToast(`Event updated: ${currentEvents[id].title}`);
   }
 });
 Object.keys(prevEvents).forEach(id=>{
   if(!currentEvents[id]){
     showToast(`Event deleted: ${prevEvents[id].title}`);
   }
 });

 prevEvents = currentEvents;
});

/* Menu toggle */
window.toggleMenu = id=>{
 document.querySelectorAll(".menu-content").forEach(m=>m.style.display="none");
 const menu = document.getElementById("menu-"+id);
 if(menu) menu.style.display="block";
}

/* Open popup */
window.openPopup = ()=>{
 editId=null;
 document.getElementById("popupTitle").innerText="Add Event";
 document.getElementById("title").value="";
 document.getElementById("date").value="";
 popup.style.display="flex";
}

/* Edit event */
window.editEvent = (id,title,date)=>{
 editId=id;
 document.getElementById("title").value=title;
 document.getElementById("date").value=date;
 document.getElementById("popupTitle").innerText="Edit Event";
 popup.style.display="flex";
}

/* Save add/edit with guaranteed popup close */
saveBtn.addEventListener("click", async ()=>{
 const title = document.getElementById("title").value;
 const date = document.getElementById("date").value;
 if(!title || !date) return alert("Fill all fields");

 const userName = localStorage.getItem("userName") || "Unknown";

 // CLOSE POPUP IMMEDIATELY
 popup.style.display = "none";

 try {
   if(editId){
     await updateDoc(doc(db,"events",editId),{title,date});
   } else {
     await addDoc(collection(db,"events"),{title,date,createdBy:userName,timestamp:Date.now()});
   }
 } catch(err){
   console.error("Error saving event:", err);
   alert("Error saving event. Try again!");
 }

 document.getElementById("title").value="";
 document.getElementById("date").value="";
});

/* Delete event */
window.deleteEvent = async id=>{
 if(confirm("Delete this event?")){
   await deleteDoc(doc(db,"events",id));
 }
}

/* Toast notifications */
function showToast(message){
 const toast = document.createElement("div");
 toast.className="toast";
 toast.innerText = message;
 document.body.appendChild(toast);
 setTimeout(()=>toast.classList.add("show"),100);
 setTimeout(()=>{
   toast.classList.remove("show");
   setTimeout(()=>toast.remove(),500);
 },3000);
}

/* Back button */
window.goBack = ()=> location.href="dashboard.html";

</script>
</body>
  </html>
