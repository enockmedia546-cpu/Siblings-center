<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Safe Video Modal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body { margin:0; font-family:Arial,sans-serif; background:#F5F3FA; }

/* VIDEO GRID */
.video-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:15px; padding:20px; }
.video-card { position:relative; cursor:pointer; border-radius:10px; overflow:hidden; }
.video-card img { width:100%; display:block; height:140px; object-fit:cover; }
.play-icon { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:36px; color:white; pointer-events:none; }

/* MODAL & OVERLAY */
#overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); display:none; z-index:999; }
#videoModal { position:fixed; top:10%; left:50%; transform:translateX(-50%); width:95%; max-width:1000px; height:50vh; background:black; display:none; z-index:1000; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,0.5); }
#videoModal iframe { width:100%; height:100%; border:none; border-radius:12px; }

/* CLOSE BUTTON as symbol */
.close-btn { position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.6); color:white; border:none; font-size:20px; width:32px; height:32px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1; }
.close-btn:hover { background:rgba(255,0,0,0.8); }
</style>
</head>
<body>

<div class="video-grid">
    <div class="video-card" data-video="https://drive.google.com/file/d/1a2B3cD4EfGhIjKlMn/preview">
        <img src="thumbnail1.jpg" alt="Video 1">
        <i class="fa fa-play-circle play-icon"></i>
    </div>
    <div class="video-card" data-video="https://drive.google.com/file/d/1HqSn9FK28XdqLUy6ibKi40VxGp4lTZ1X/preview">
        <img src="fam.jpg" alt="Video 2">
        <i class="fa fa-play-circle play-icon"></i>
    </div>
</div>

<div id="overlay"></div>

<div id="videoModal">
    <iframe id="modalVideo" allow="autoplay; fullscreen"></iframe>
    <button class="close-btn" onclick="closeVideo()">×</button>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const cards = document.querySelectorAll('.video-card');
    const modal = document.getElementById('videoModal');
    const overlay = document.getElementById('overlay');
    const iframe = document.getElementById('modalVideo');

    cards.forEach(card => {
        card.addEventListener('click', () => {
            const link = card.dataset.video;
            iframe.src = link; // only set on click
            modal.style.display = 'flex';
            overlay.style.display = 'block';
        });
    });

    overlay.addEventListener('click', closeVideo);
});

function closeVideo() {
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('videoModal').style.display = 'none';
    document.getElementById('modalVideo').src = ''; // stop video
}
</script>

</body>
</html>
