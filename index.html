<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Siblings Center | Sign Up</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background: url('Big.jpg') center/cover no-repeat;
    background-attachment: fixed;
}
body::before {
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.3);
    z-index:-1;
}
.form-container{
    max-width:400px;
    margin:80px auto;
    background:rgba(255,255,255,0.5);
    backdrop-filter:blur(6px);
    padding:30px;
    border-radius:20px;
}
input,button{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:none;
}
button{
    background:#7c3aed;
    color:white;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="form-container">
<h2>Create Account</h2>
<form id="signupForm">
<input type="text" id="name" placeholder="Full Name" required>
<input type="email" id="email" placeholder="Email" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Sign Up</button>
</form>
<a href="login.html">Already have an account? Login</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyBdlDAj6SBzRChqDRfvecD_XRFgeSjKtiQ",
  authDomain: "siblings-140f7.firebaseapp.com",
  projectId: "siblings-140f7",
  storageBucket: "siblings-140f7.appspot.com",
  messagingSenderId: "17665689198",
  appId: "1:17665689198:web:575e848f837d7b35b4c87f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

document.getElementById("signupForm").addEventListener("submit", async (e)=>{
  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if(!name || !email || !password){
    alert("Please fill all fields");
    return;
  }

  try{
    const userCred = await createUserWithEmailAndPassword(auth,email,password);

    await updateProfile(userCred.user,{displayName:name});

    await setDoc(doc(db,"users",userCred.user.uid),{
      name: name,
      email: email,
      photo: "default.png",
      role: "user",
      createdAt: serverTimestamp()
    });

    alert("Account created successfully!");
    window.location.href="dashboard.html";

  }catch(err){
    alert(err.message);
  }
});
</script>

</body>
</html>
