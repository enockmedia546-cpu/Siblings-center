<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Family Chat | Siblings Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Arial, sans-serif;display:flex;flex-direction:column;height:100vh;background:#0F0F0F;color:white;}
header{background:#3B0A66;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;}
header h2{margin:0;font-weight:500;}
.back-btn{font-size:22px;cursor:pointer;color:white;}

#chatArea{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px;background:#0F0F0F;}
.message-wrapper{display:flex;align-items:flex-end;gap:8px;position:relative;}
.my-message-wrapper{flex-direction:row-reverse;}
.profile-pic{width:34px;height:34px;border-radius:50%;object-fit:cover;}

.my-message,.other-message{
  padding:12px;border-radius:14px;max-width:75%;word-wrap:break-word;
  display:flex;flex-direction:column;box-shadow:0 4px 10px rgba(0,0,0,.4);position:relative;
  transition:background 0.2s;
}
.my-message{background:#7C3AED;color:white;border-bottom-right-radius:4px;}
.my-message:hover{background:#9146FF;}
.other-message{background:#2E2E2E;color:#ddd;border-bottom-left-radius:4px;}
.other-message:hover{background:#4B2E8D;}

.msg-time{font-size:10px;color:#bbb;margin-top:4px;text-align:right;}
.reply-block{
  font-size:12px;color:#ccc;padding:6px 10px;margin-bottom:6px;
  border-left:3px solid #9146FF;border-radius:6px;display:flex;align-items:flex-start;
  gap:6px;background:rgba(255,255,255,0.05);overflow-wrap:break-word;
}
.reply-block img{width:20px;height:20px;border-radius:50%;object-fit:cover;flex-shrink:0;}

.menu-btn{
  font-size:16px;cursor:pointer;position:absolute;top:6px;right:6px;color:#aaa;user-select:none;
}
.menu-content{
  display:none;position:absolute;right:0;top:20px;background:#1A1A1A;border-radius:8px;
  box-shadow:0 2px 10px rgba(0,0,0,.5);min-width:100px;z-index:10;
}
.menu-content div{
  padding:6px 10px;color:white;cursor:pointer;
}
.menu-content div:hover{background:#3B0A66;}

#inputArea{display:flex;padding:10px;background:#0F0F0F;border-top:1px solid #222;}
#chatInput{flex:1;padding:12px 16px;border-radius:25px;border:none;background:#2E2E2E;color:white;outline:none;}
#sendBtn{width:46px;height:46px;border:none;background:#7C3AED;color:white;border-radius:50%;font-size:20px;margin-left:10px;cursor:pointer;transition:0.2s;}
#sendBtn:hover{background:#9146FF;}
</style>
</head>
<body>

<header>
 <span class="back-btn" onclick="window.history.back()">←</span>
 <h2>SIBLINGS CHAT ROOM</h2>
</header>

<div id="chatArea"></div>

<div id="inputArea">
 <input id="chatInput" placeholder="Type a message...">
 <button id="sendBtn">➤</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, serverTimestamp, onSnapshot, deleteDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBdlDAj6SBzRChqDRfvecD_XRFgeSjKtiQ",
  authDomain: "siblings-140f7.firebaseapp.com",
  projectId: "siblings-140f7",
  storageBucket: "siblings-140f7.appspot.com",
  messagingSenderId: "17665689198",
  appId: "1:17665689198:web:575e848f837d7b35c87f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let replyToMessage = null;

const chatArea = document.getElementById("chatArea");
const chatInput = document.getElementById("chatInput");
const sendBtn = document.getElementById("sendBtn");

// AUTH
onAuthStateChanged(auth, user=>{
    if(!user) window.location="login.html";
    currentUser = user;
    loadMessages();
});

// SEND MESSAGE
sendBtn.addEventListener("click", sendMessage);
chatInput.addEventListener("keypress", e=>{if(e.key==="Enter") sendMessage();});

async function sendMessage(){
  const text = chatInput.value.trim();
  if(!text || !currentUser) return;

  const msgData = {
    text,
    uid: currentUser.uid,
    timestamp: serverTimestamp()
  };

  if(replyToMessage){
    msgData.replyTo = {...replyToMessage};
    replyToMessage = null;
  }

  await addDoc(collection(db,"messages"), msgData);
  chatInput.value="";
}

// LOAD MESSAGES
function loadMessages(){
  const q = query(collection(db,"messages"), orderBy("timestamp"));
  onSnapshot(q, async snap=>{
    chatArea.innerHTML = "";

    // Collect all user IDs to fetch profiles
    const userIds = new Set();
    snap.docs.forEach(docu=>{
      const msg = docu.data();
      userIds.add(msg.uid);
      if(msg.replyTo) userIds.add(msg.replyTo.uid);
    });

    const usersMap = {};
    await Promise.all(Array.from(userIds).map(async uid=>{
      const userSnap = await getDoc(doc(db,"users",uid));
      usersMap[uid] = userSnap.exists() ? userSnap.data() : {name:"Unknown", photo:"default.png"};
    }));

    snap.docs.forEach(docu=>{
      const msg = docu.data();
      const sender = usersMap[msg.uid];

      let replyHTML = "";
      if(msg.replyTo){
        const replyUser = usersMap[msg.replyTo.uid];
        replyHTML = `
          <div class="reply-block">
            <img src="${replyUser.photo}" alt="">
            <div><strong>@${replyUser.name}</strong>: ${msg.replyTo.text}</div>
          </div>
        `;
      }

      const wrapper = document.createElement("div");
      wrapper.className = "message-wrapper "+(msg.uid===currentUser.uid?"my-message-wrapper":"");
      wrapper.innerHTML = `
        <img src="${sender.photo}" class="profile-pic">
        <div class="${msg.uid===currentUser.uid?'my-message':'other-message'}">
          <strong>${sender.name}</strong>
          ${replyHTML}
          <p>${msg.text}</p>
          <span class="msg-time">${msg.timestamp ? new Date(msg.timestamp.seconds*1000).toLocaleTimeString() : ""}</span>
          <span class="menu-btn">⋮</span>
          <div class="menu-content">
            ${msg.uid===currentUser.uid ? `<div onclick="deleteMessage('${docu.id}')">Delete</div>` : ""}
            <div onclick="replyMessage('${msg.uid}','${sender.name}','${msg.text}','${sender.photo}')">Reply</div>
          </div>
        </div>
      `;
      chatArea.appendChild(wrapper);

      wrapper.querySelector(".menu-btn").onclick = e=>{
        e.stopPropagation();
        const menu = wrapper.querySelector(".menu-content");
        document.querySelectorAll(".menu-content").forEach(m=>{if(m!==menu)m.style.display="none"});
        menu.style.display = menu.style.display==="block"?"none":"block";
      };
    });

    chatArea.scrollTop = chatArea.scrollHeight;
  });
}

// DELETE
window.deleteMessage = async (id)=>{
  if(confirm("Delete this message?")) await deleteDoc(doc(db,"messages",id));
}

// REPLY
window.replyMessage = (uid,name,text,photo)=>{
  replyToMessage = {uid,name,text,photo};
  chatInput.value = `@${name} `;
  chatInput.focus();
}

// CLOSE ALL MENUS WHEN CLICKING OUTSIDE
document.addEventListener("click", ()=>{
  document.querySelectorAll(".menu-content").forEach(m=>m.style.display="none");
});
</script>

</body>
</html>
