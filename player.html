<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Siblings Center | Sign Up</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background: url('wed.jpg') center/cover no-repeat;
    background-attachment: fixed;
    position: relative;
}

body::before {
    content: "";
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.3);
    z-index: -1;
}

.form-container {
    max-width: 400px;
    margin: 80px auto;
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(6px);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}

.form-container h2 {
    text-align:center;
    margin-bottom:20px;
    color:#3B0A66;
}

.form-container input {
    width: 100%;
    padding: 12px 15px;
    margin: 10px 0;
    border-radius: 10px;
    border: none;
    outline: none;
    font-size: 16px;
}

.form-container button {
    width: 100%;
    padding: 12px;
    background: #7c3aed;
    border:none;
    color:white;
    font-size:16px;
    border-radius:10px;
    cursor:pointer;
    margin-top:10px;
    transition:0.2s;
}

.form-container button:hover {
    background:#9d4edd;
}

a {
    display:block;
    text-align:center;
    margin-top:12px;
    text-decoration:none;
    color:#5B0E9E;
}
</style>
</head>

<body>

<div class="form-container">
    <h2>Create Account</h2>
    <form id="signupForm">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Sign Up</button>
    </form>
    <a href="login.html">Already have an account? Login</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBdlDAj6SBzRChqDRfvecD_XRFgeSjKtiQ",
  authDomain: "siblings-140f7.firebaseapp.com",
  projectId: "siblings-140f7",
  storageBucket: "siblings-140f7.firebasestorage.app",
  messagingSenderId: "17665689198",
  appId: "1:17665689198:web:575e848f837d7b35b4c87f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const signUpForm = document.getElementById("signupForm");

signUpForm.addEventListener("submit", (e)=>{
    e.preventDefault();
    const name = signUpForm.name.value.trim();
    const email = signUpForm.email.value.trim();
    const password = signUpForm.password.value.trim();

    if(!name || !email || !password){
        alert("Please fill all fields");
        return;
    }

    createUserWithEmailAndPassword(auth, email, password)
    .then((userCredential)=>{
        updateProfile(userCredential.user, { displayName: name });
        alert("Account created successfully!");
        window.location.href = "dashboard.html";
    })
    .catch((error)=>{
        alert(error.message);
    });
});
</script>

</body>
</html>
